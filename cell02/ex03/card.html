<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h2>User Profile Card</h2>

    <div class="card">
        <table class="invisible-table">
            <tr>
                <td>
                    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=400&q=80" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="cell-login">
                    mwarrara
                </td>
            </tr>
            <tr>
                <td class="cell-desc">
                    Discovery Piscine Student
                </td>
            </tr>
            <tr>
                <td class="cell-loc">
                    42Bangkok
                </td>
            </tr>
            <tr>
                <td class="cell-social">
                    <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="web">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="twitter">
                    <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="linkedin">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="facebook">
                </td>
            </tr>
            <tr>
                <td class="cell-btn">
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
