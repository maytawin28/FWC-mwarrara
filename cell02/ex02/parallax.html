<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Exercise</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- First Parallax Section -->
    <div class="parallax bg1">
        <div class="caption">
            <span class="text">Cute dog</span>
        </div>
    </div>

    <!-- Black Block Section -->
    <div class="section-black">
        <p>Hi from 42Paris !</p>
    </div>

    <!-- Second Parallax Section -->
    <div class="parallax bg2">
        <div class="caption">
            <span class="text">Fluffy dog</span>
        </div>
    </div>

</body>
</html>
